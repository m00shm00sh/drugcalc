flags {
    httpDevMode = true
    httpDevMode = ${?HTTP_DEV_MODE}
    allowDbClear = true
    allowDbClear = ${?ALLOW_DB_CLEAR}
    sendStackTrace = true
    sendStackTrace = ${?SEND_STACKTRACE}
    dumpCausesToLog = true
    dumpCausesToLog = ${?DUMP_CAUSES_TO_LOG}
    allowEmptyDb = true
}

http {
    bind = [
        {
            host = 127.0.0.1
            host = ${?HTTP_HOST}
            port = 8080
            port = ${?HTTP_PORT}
        }
        #,
      #  {
      #      host = 127.0.0.1
      #      host = ${?HTTP_SSL_HOST}
      #      sslPort = 8443
      #      sslPort = ${?HTTP_SSL_PORT}
      #  }
    ]
    sslKey {
        pemPath = []
    }

    limits {
        requestBodyLimit = 1048576
        requestBodyLimit = ${?REQ_BODY_LIMIT}

        globalRateLimit {
            num = 1000
            num = ${?GLOBAL_RATE_LIMIT_NUM}
            time = 1s
            time = ${?GLOBAL_RATE_LIMIT_TIME}
        }
        clientRateLimit {
            num = 10
            num = ${?CLIENT_RATE_LIMIT_NUM}
            time = 1s
            time = ${?CLIENT_RATE_LIMIT_TIME}
        }
    }
}

db {
    driver = "postgresql"
    url = "//localhost:5432/drugcalc"
    url = ${?DB_URL}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}


jwt {
    audience = "dc-user"
    issuer = "http://127.0.0.1"
    realm  = "v0"
    secret = ${?SECRET}
    timeout = 1h
}

dataController {
    readOnlyMode = false
    readOnlyMode = ${?DATA_READONLY_MODE}

    compoundEvictionPolicy.accessTime = 1m
    frequencyEvictionPolicy.accessTime = 1m
}
